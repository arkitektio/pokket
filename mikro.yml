overwrite: true
schema:
  "http://jhnnsrs-lab/mikro/schema":
    handleAsSDL: true
documents: "graphql/mikro/**/*.graphql"
generates:
  lib/mikro/api/fragments.ts:
    plugins:
      - "fragment-matcher"
  lib/mikro/api/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-react-apollo"
    config:
      withHooks: true
      reactApolloVersion: 3
      apolloReactHooksImportFrom: "@/lib/mikro/funcs"

  lib/mikro/graphql.schema.json:
    plugins:
      - "introspection"
config:
  scalars:
    DateTime: string
    ByteCount: number
