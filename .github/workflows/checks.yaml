name: Checks

# Fast feedback on pull requests, all on Linux, no native build:
#  - tests: jest.
#  - preview: the pull request's JS as an over-the-air update on the EAS
#    branch `pr-<number>`. Open it in the development client (README,
#    "Install") to try the change on a phone within minutes. Only for
#    branches of this repository: forks get no EXPO_TOKEN.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --ci

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish the preview update
        id: update
        env:
          # Through the environment, never spliced into the script: a title is
          # whatever the author typed.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          eas update --branch "pr-$PR" --environment preview --non-interactive --json \
            --message "#$PR: $TITLE" > update.json
          echo "group=$(jq -r '.[0].group' update.json)" >> "$GITHUB_OUTPUT"
          echo "runtime=$(jq -r '[.[] | "\(.platform): `\(.runtimeVersion)`"] | join(", ")' update.json)" >> "$GITHUB_OUTPUT"

      # One comment per pull request, updated on every push.
      - name: Comment on the pull request
        env:
          GROUP: ${{ steps.update.outputs.group }}
          RUNTIME: ${{ steps.update.outputs.runtime }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker="<!-- pokket-preview -->"
          body="$marker
          ### Preview on your phone

          This pull request's JS is published as an over-the-air update on the EAS branch \`pr-$PR\`.
          Open **[its update page](https://expo.dev/accounts/arkitektio/projects/pokket/updates/$GROUP)** and scan
          the QR code with the camera, with the [development client](https://github.com/$GITHUB_REPOSITORY/releases/tag/dev-client) installed.

          It only runs on a development client with the same native side (runtime ${RUNTIME}). If this pull request
          changes native code, the \"Dev client\" workflow builds a new one for it first.

          _Updated for ${HEAD_SHA::7}._"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi
