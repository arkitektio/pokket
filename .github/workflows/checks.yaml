name: Checks

# Fast feedback on pull requests, all on Linux, no native build:
#  - tests: jest.
#  - preview: the pull request's JS as an over-the-air update on the channel
#    `pr-<number>` of updates.arkitekt.live. Open it in the development client
#    (README, "Install") to try the change on a phone within minutes. Only for
#    branches of this repository: forks get no UPDATES_TOKEN or EXPO_TOKEN.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --ci

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish the preview update
        id: update
        env:
          UPDATES_TOKEN: ${{ secrets.UPDATES_TOKEN }}
          # Through the environment, never spliced into the script: a title is
          # whatever the author typed.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The EXPO_PUBLIC_* values `eas update --environment preview` used to inject.
          eas env:pull --environment preview --non-interactive
          # A development client sends no channel header (expo-dev-launcher
          # replaces the request headers), so the channel goes in the URL.
          manifest="https://updates.arkitekt.live/api/manifest?channel=pr-$PR"
          runtimes=()
          for platform in android ios; do
            rv="$(npx expo-updates runtimeversion:resolve --platform "$platform" | jq -r .runtimeVersion)"
            published="$(scripts/ci/publish-update.sh "$platform" "$rv" "pr-$PR" "#$PR: $TITLE")"
            echo "$platform: $published"
            # What a dev client on this runtime gets from that URL must be this update.
            served="$(curl -fsS -H "expo-platform: $platform" -H "expo-runtime-version: $rv" \
              -H "expo-protocol-version: 1" -H "accept: multipart/mixed" "$manifest" \
              | grep -o '"id": *"[^"]*"' | sed 's/.*"\([^"]*\)"$/\1/' || true)"
            match=false
            for id in $served; do [[ "$published" == *"$id"* ]] && match=true; done
            if [ "$match" != true ]; then
              echo "::error::$manifest does not serve the update just published to $platform $rv"
              exit 1
            fi
            runtimes+=("$platform: \`$rv\`")
          done
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "runtime=${runtimes[0]}, ${runtimes[1]}" >> "$GITHUB_OUTPUT"

      # One comment per pull request, updated on every push.
      - name: Comment on the pull request
        env:
          MANIFEST: ${{ steps.update.outputs.manifest }}
          RUNTIME: ${{ steps.update.outputs.runtime }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # What the camera opens: the development client, told to load MANIFEST.
          link="pokket://expo-development-client/?url=$(jq -rn --arg u "$MANIFEST" '$u|@uri')"
          qr="https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=8&data=$(jq -rn --arg u "$link" '$u|@uri')"
          marker="<!-- pokket-preview -->"
          body="$marker
          ### Preview on your phone

          This pull request's JS is published as an over-the-air update on the channel \`pr-$PR\` of updates.arkitekt.live.
          With the [development client](https://github.com/$GITHUB_REPOSITORY/releases/tag/dev-client) installed, scan
          this with the camera:

          <img src=\"$qr\" width=\"240\" height=\"240\" alt=\"QR code opening the preview in the development client\">

          Or, in the development client, enter this URL by hand: \`$MANIFEST\`

          It only runs on a development client with the same native side (runtime ${RUNTIME}). If this pull request
          changes native code, the published one will not do: the \"Dev client\" run of this pull request builds an
          Android dev client for it, under that run's artifacts.

          _Updated for ${HEAD_SHA::7}._"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi
