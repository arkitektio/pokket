name: Release (Android APK, iOS TestFlight, over-the-air)

# On every push to main, semantic-release decides whether the commits since
# the last release make a new version (feat → minor, fix → patch). If they do:
#
#  - Each platform checks whether this version changed anything native, by its
#    runtime version (the native fingerprint, app.config.ts) — see
#    scripts/ci/native-build.sh.
#  - JS only (the usual case): publish an over-the-air update. Installed apps
#    download it on their next launch and offer a restart (lib/updates).
#    A few minutes.
#  - Native changes: also build a new binary on GitHub's runners (never the
#    EAS build queue) — an APK, and an iOS build on TestFlight — and record
#    it, so the next JS-only release knows it needs none.
#  - Either way the release carries pokket.apk (a JS-only release a copy of
#    the newest one), so the "Latest" release always has the download, and
#    its notes say what to install from where (scripts/ci/release-notes.sh).
#
# Where to download what is in README.md ("Install").

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

# One release at a time, and never cancel one half-way (a tag without its
# builds, or a TestFlight upload cut off).
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Opt-in to Node 24 for all actions to satisfy 2026 requirements
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false # Required for semantic-release

      # Must precede setup-node: `cache: "pnpm"` resolves the store path by
      # invoking pnpm, so pnpm has to be on PATH before that step runs.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine Version and Create Tag
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/git
            @semantic-release/changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Android
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    # A release build takes ~25 minutes. Fail well before GitHub's 6 hours if
    # Gradle hangs again (see plugins/withGradleMemory.js).
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.release.outputs.version }}
    # For the release notes (scripts/ci/release-notes.sh).
    outputs:
      apk: ${{ steps.apk.outputs.apk }}
      apk_from: ${{ steps.apk.outputs.from }}
    steps:
      # The release commit and tag semantic-release just pushed: package.json
      # there carries the new version (app.config.ts reads it).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Does this release need a new APK?
        id: native
        run: scripts/ci/native-build.sh check android

      - name: Setup Java
        if: steps.native.outputs.needed == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Go
        if: steps.native.outputs.needed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: modules/pokket-mesh/go/go.mod
          cache-dependency-path: modules/pokket-mesh/go/go.sum

      # The mesh sidecar's Go half (gomobile), picked up by modules/pokket-mesh.
      # Rebuilt only when its sources change.
      - name: Restore Mesh Sidecar
        id: mesh
        if: steps.native.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            modules/pokket-mesh/android/libs
            modules/pokket-mesh/android/src/main/jniLibs
          key: mesh-android-${{ hashFiles('modules/pokket-mesh/go/**', 'scripts/build-mesh-mobile.sh') }}

      # The runner image ships an NDK; the script reads ANDROID_NDK_LATEST_HOME.
      - name: Build Mesh Sidecar
        if: steps.native.outputs.needed == 'true' && steps.mesh.outputs.cache-hit != 'true'
        run: pnpm build:mesh:android

      - name: Build APK
        if: steps.native.outputs.needed == 'true'
        run: eas build --platform android --profile apk --non-interactive --local --output=./pokket.apk

      # Every release carries pokket.apk, so the "Latest" release always has
      # the download, and releases/latest/download/pokket.apk always works.
      - name: Attach the APK to the release
        id: apk
        run: |
          if [ "${{ steps.native.outputs.needed }}" = "true" ]; then
            gh release upload "v$VERSION" "pokket.apk#pokket $VERSION for Android" --clobber
            echo "apk=built" >> "$GITHUB_OUTPUT"
          else
            # JS only: the newest APK is still the app. It picks this release's
            # JS up over the air on its first launch.
            from="$(scripts/ci/copy-apk.sh "v$VERSION" pokket.apk)"
            gh release upload "v$VERSION" \
              "pokket.apk#pokket $VERSION for Android (app from $from; updates itself on first launch)" --clobber
            echo "apk=copied" >> "$GITHUB_OUTPUT"
            echo "from=$from" >> "$GITHUB_OUTPUT"
          fi

      - name: Record the build
        if: steps.native.outputs.needed == 'true'
        run: scripts/ci/native-build.sh mark "${{ steps.native.outputs.tag }}"

      # Installed apps on this runtime version pick this release's JS up on
      # their next launch. After a native build it only reaches the new APK;
      # older installs keep what they have until they install it.
      - name: Publish Over-the-Air Update
        run: >
          eas update --channel production --environment production --platform android
          --message "v$VERSION" --non-interactive

  # iOS: the same, on a Mac. A new build is signed with the credentials stored
  # on EAS (the arkitektio account: distribution certificate, provisioning
  # profile, App Store Connect API key) and uploaded to TestFlight, so
  # EXPO_TOKEN is all it needs from GitHub — plus the app's numeric App Store
  # Connect id, which `eas submit` cannot look up without asking (secret
  # ASC_APP_ID).
  ios:
    name: iOS
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.release.outputs.version }}
    # For the release notes: whether a new build went to TestFlight.
    outputs:
      ios: ${{ steps.native.outputs.needed == 'true' && 'testflight' || 'ota' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Resolved here on the Mac, as the build and the update below will be.
      - name: Does this release need a new iOS build?
        id: native
        run: scripts/ci/native-build.sh check ios

      - name: Setup Go
        if: steps.native.outputs.needed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: modules/pokket-mesh/go/go.mod
          cache-dependency-path: modules/pokket-mesh/go/go.sum

      - name: Restore Mesh Sidecar
        id: mesh
        if: steps.native.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: modules/pokket-mesh/ios/Meshmobile.xcframework
          key: mesh-ios-${{ hashFiles('modules/pokket-mesh/go/**', 'scripts/build-mesh-mobile.sh') }}

      - name: Build Mesh Sidecar
        if: steps.native.outputs.needed == 'true' && steps.mesh.outputs.cache-hit != 'true'
        run: pnpm build:mesh:ios

      - name: Build IPA
        if: steps.native.outputs.needed == 'true'
        run: >
          eas build --platform ios --profile production --local --non-interactive
          --freeze-credentials --output=./pokket.ipa

      - name: Submit to TestFlight
        if: steps.native.outputs.needed == 'true'
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: |
          # Kept out of the repository; `eas submit` needs it to run unattended.
          jq --arg id "$ASC_APP_ID" '.submit.production.ios.ascAppId = $id' eas.json > eas.json.tmp
          mv eas.json.tmp eas.json
          # No --what-to-test: EAS only takes a changelog on its Enterprise plan.
          eas submit --platform ios --profile production --path ./pokket.ipa --non-interactive
          # eas.json is part of the native fingerprint: left edited, the update
          # below would go to a runtime version no installed app has.
          git checkout -- eas.json

      - name: Record the build
        if: steps.native.outputs.needed == 'true'
        run: scripts/ci/native-build.sh mark "${{ steps.native.outputs.tag }}"

      - name: Publish Over-the-Air Update
        run: >
          eas update --channel production --environment production --platform ios
          --message "v$VERSION" --non-interactive

  # The release's notes: what to install from where, and what changed. Runs
  # after both platforms, also when one failed, so the notes say so.
  notes:
    name: Release notes
    needs: [release, android, ios]
    if: always() && needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
          # The commits since the previous release.
          fetch-depth: 0

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          ANDROID_RESULT: ${{ needs.android.result }}
          APK: ${{ needs.android.outputs.apk }}
          APK_FROM: ${{ needs.android.outputs.apk_from }}
          IOS_RESULT: ${{ needs.ios.result }}
          IOS: ${{ needs.ios.outputs.ios }}
          TESTFLIGHT_URL: ${{ vars.TESTFLIGHT_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/ci/release-notes.sh
