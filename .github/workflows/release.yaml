name: Release (Android APK, iOS TestFlight, over-the-air)

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  # Opt-in to Node 24 for all actions to satisfy 2026 requirements
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false # Required for semantic-release

      # Must precede setup-node: `cache: "pnpm"` resolves the store path by
      # invoking pnpm, so pnpm has to be on PATH before that step runs.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine Version and Create Tag
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/git
            @semantic-release/changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: modules/pokket-mesh/go/go.mod
          cache-dependency-path: modules/pokket-mesh/go/go.sum

      # The mesh sidecar's Go half (gomobile), picked up by modules/pokket-mesh.
      # The runner image ships an NDK; the script reads ANDROID_NDK_LATEST_HOME.
      - name: Build Mesh Sidecar
        if: steps.semantic.outputs.new_release_published == 'true'
        run: pnpm build:mesh:android

      - name: Build APK Locally
        # This only runs if a new version was actually detected
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          eas build --platform android --profile apk --non-interactive --local --output=./app-release.apk

      # Over-the-air: installed apps pick this release's JS up on their next
      # launch (lib/updates offers a restart once it is downloaded). It only
      # reaches binaries with the same native fingerprint (app.config.ts):
      # when this release changed native code, only the APK above gets it,
      # and older installs keep what they have until updated.
      # Android here; the iOS job publishes iOS's, from the Mac that built it.
      - name: Publish Over-the-Air Update
        if: steps.semantic.outputs.new_release_published == 'true'
        run: >
          eas update --channel production --environment production --platform android
          --message "v${{ steps.semantic.outputs.new_release_version }}" --non-interactive

      - name: Upload APK to GitHub Release
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.semantic.outputs.new_release_version }}
          files: ./app-release.apk
          body: ${{ steps.semantic.outputs.new_release_notes }}

  # iOS: a signed App Store build of the release, uploaded to TestFlight, and
  # its over-the-air update. Signs with the credentials stored on EAS (the
  # arkitektio account: distribution certificate, provisioning profile, App
  # Store Connect API key), so EXPO_TOKEN is all it needs from GitHub — plus
  # the app's numeric App Store Connect id, which `eas submit` cannot look up
  # without asking (secret ASC_APP_ID).
  ios:
    name: iOS → TestFlight
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      # The release commit and tag semantic-release just pushed: package.json
      # there carries the new version (app.config.ts reads it).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: modules/pokket-mesh/go/go.mod
          cache-dependency-path: modules/pokket-mesh/go/go.sum

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # The mesh sidecar's Go half, as Meshmobile.xcframework.
      - name: Build Mesh Sidecar
        run: pnpm build:mesh:ios

      - name: Build IPA Locally
        run: >
          eas build --platform ios --profile production --local --non-interactive
          --freeze-credentials --output=./pokket.ipa

      - name: Submit to TestFlight
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: |
          # Kept out of the repository; `eas submit` needs it to run unattended.
          jq --arg id "$ASC_APP_ID" '.submit.production.ios.ascAppId = $id' eas.json > eas.json.tmp
          mv eas.json.tmp eas.json
          eas submit --platform ios --profile production --path ./pokket.ipa --non-interactive \
            --what-to-test "Pokket v${{ needs.release.outputs.version }}"

      - name: Publish Over-the-Air Update
        run: >
          eas update --channel production --environment production --platform ios
          --message "v${{ needs.release.outputs.version }}" --non-interactive
