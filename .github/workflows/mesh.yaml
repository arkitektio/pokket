name: Mesh sidecar

# Verifies the organisation-mesh sidecar end to end:
#  - go:      unit + tailnet end-to-end tests of the Go library
#  - js:      jest tests of the fakts client and lib/mesh
#  - android: gomobile build (16 KB pages), release APK, and an emulator run
#             in which the app joins a test tailnet and talks through it
#  - ios:     gomobile build, Release simulator app, and the same run on a simulator
# Both device jobs run twice: the release build, and a development build
# (expo-dev-client, JS from Metro) — the one used to work on the app. Each
# run also checks that deep links reach the app's JS.

on:
  # Branches run through their pull request; a push trigger on them as well
  # would run every device job twice.
  push:
    branches: [main]
    paths:
      - "modules/pokket-mesh/**"
      - "lib/mesh/**"
      - "lib/arkitekt/**"
      - "lib/testing/**"
      - "app/mesh*.tsx"
      - "app/_layout.tsx"
      - "app.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/build-mesh-mobile.sh"
      - "scripts/ci/**"
      - ".github/workflows/mesh.yaml"
  pull_request:
    paths:
      - "modules/pokket-mesh/**"
      - "lib/mesh/**"
      - "lib/arkitekt/**"
      - "lib/testing/**"
      - "app/mesh*.tsx"
      - "app/_layout.tsx"
      - "app.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/build-mesh-mobile.sh"
      - "scripts/ci/**"
      - ".github/workflows/mesh.yaml"
  workflow_dispatch:

concurrency:
  group: mesh-${{ github.ref }}
  # Queue rather than cancel: the device jobs take ~30 min, and a push while
  # one runs should not throw away its result.
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: modules/pokket-mesh/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: modules/pokket-mesh/go/go.mod
          cache-dependency-path: modules/pokket-mesh/go/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Cross-compile for the phones
        run: |
          GOOS=android GOARCH=arm64 go build ./...
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 go vet ./...

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --ci
      - run: >
          pnpm exec eslint app/mesh.tsx app/mesh-selftest.tsx lib/mesh lib/testing
          modules/pokket-mesh/index.ts modules/pokket-mesh/app.plugin.js

  android:
    name: android (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [release, dev]
    env:
      # Bundled into the JS at build time: turns on app/mesh-selftest.tsx.
      EXPO_PUBLIC_MESH_SELFTEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: actions/setup-go@v5
        with:
          go-version-file: modules/pokket-mesh/go/go.mod
          cache-dependency-path: modules/pokket-mesh/go/go.sum
      - run: pnpm install --frozen-lockfile

      - name: Build the Go library (checks 16 KB alignment)
        run: pnpm build:mesh:android

      - name: Prebuild
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build the APK
        working-directory: android
        # x86_64 for the emulator, arm64 to prove the phone ABI links too.
        # Packaging two ~40 MB Go libraries next to WebRTC outgrows the template's
        # 2 GB Gradle heap.
        run: |
          df -h .
          task=${{ matrix.variant == 'release' && 'assembleRelease' || 'assembleDebug' }}
          ./gradlew ":app:$task" -PreactNativeArchitectures=x86_64,arm64-v8a --no-daemon --stacktrace \
            "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
          apk="$(ls app/build/outputs/apk/*/app-*.apk | head -n1)"
          echo "APK=$GITHUB_WORKSPACE/android/$apk" >> "$GITHUB_ENV"

      - name: Upload the Gradle problems report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-problems-${{ matrix.variant }}
          path: android/build/reports/problems/
          if-no-files-found: ignore

      - name: Check the APK
        run: |
          apk="$APK"
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)"
          manifest="$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")"
          echo "$manifest" | grep -q 'android:usesCleartextTraffic.*=true' || { echo "the APK does not allow cleartext"; exit 1; }
          echo "$manifest" | grep -q 'android.permission.ACCESS_NETWORK_STATE' || { echo "ACCESS_NETWORK_STATE missing"; exit 1; }
          unzip -l "$apk" | grep -E 'lib/(x86_64|arm64-v8a)/libgojni.so' || { echo "libgojni.so missing"; exit 1; }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Self-test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: scripts/ci/mesh-device-e2e-android.sh "$APK" ${{ matrix.variant }}

      - name: Upload self-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-selftest-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/mesh-e2e/*.png
            ${{ runner.temp }}/mesh-e2e/*.log
            ${{ runner.temp }}/mesh-e2e/*.json
            ${{ runner.temp }}/mesh-e2e/metro.log
          if-no-files-found: ignore

  ios:
    name: ios (${{ matrix.variant }})
    runs-on: macos-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        variant: [release, dev]
    env:
      EXPO_PUBLIC_MESH_SELFTEST: "1"
      # The simulator shares the Mac's loopback, so the test tailnet's addresses
      # are known before the build: bake them in, and the self-test starts on
      # launch rather than hinging on the deep link reaching the app.
      MESH_E2E_CONTROL_PORT: "47001"
      MESH_E2E_PROGRESS_PORT: "47002"
      EXPO_PUBLIC_MESH_SELFTEST_AUTORUN: "control=http%3A%2F%2F127.0.0.1%3A47001&key=tskey-auth-pokket-test&host=svc&port=8080&progress=http%3A%2F%2F127.0.0.1%3A47002%2Fprogress"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: modules/pokket-mesh/go/go.mod
          cache-dependency-path: modules/pokket-mesh/go/go.sum
      - run: pnpm install --frozen-lockfile

      - name: Build the Go framework
        run: pnpm build:mesh:ios

      - name: Prebuild
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Check Info.plist
        run: |
          plist=ios/pokket/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$plist" | grep -qi mesh
          /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsLocalNetworking' "$plist" | grep -q true

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build the simulator app
        working-directory: ios
        run: |
          set -o pipefail
          configuration=${{ matrix.variant == 'release' && 'Release' || 'Debug' }}
          xcodebuild -workspace pokket.xcworkspace -scheme pokket -configuration "$configuration" \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 60
          echo "APP=$GITHUB_WORKSPACE/ios/build/Build/Products/$configuration-iphonesimulator/pokket.app" >> "$GITHUB_ENV"

      - name: Self-test on a simulator
        run: scripts/ci/mesh-device-e2e-ios.sh "$APP" ${{ matrix.variant }}

      - name: Upload self-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-selftest-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/mesh-e2e/*.png
            ${{ runner.temp }}/mesh-e2e/*.log
            ${{ runner.temp }}/mesh-e2e/*.json
            ${{ runner.temp }}/mesh-e2e/metro.log
          if-no-files-found: ignore
