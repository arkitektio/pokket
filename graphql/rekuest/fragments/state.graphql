fragment StatePatchEvent on StatePatchEvent {
  stateId
  agentId
  op
  path
  value
  globalRevision
  sessionId
  timestamp
  interface
}

fragment StateSnapshotEvent on StateSnapshotEvent {
  stateId
  agentId
  interface
  value
  globalRevision
  sessionId
  timestamp
}

# One recorded change of an agent's state: what time travel replays.
fragment Patch on Patch {
  id
  op
  path
  value
  interface
  timestamp
  globalFutureRevision
}
