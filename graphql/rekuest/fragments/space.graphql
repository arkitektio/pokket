fragment ListSpace on Space {
  id
  name
}

# A placement as a space shows it: the 3D view (a materialized scene blok) that
# stands in the room, the agent it belongs to, and where it stands.
fragment SpacePlacement on Placement {
  id
  name
  role
  agent {
    id
    name
    connected
  }
  blok {
    id
    name
    blok {
      id
      name
      context
    }
  }
  affineMatrix
}

# A 3D blok standing in a space on its own, with no agent. Where it sits is a
# 4x4 affine, as for an agent's placement.
fragment SpaceBlokPlacement on SpacePlacement {
  id
  name
  affineMatrix
  blok {
    id
    name
    blok {
      id
      name
      context
    }
  }
}

fragment Space on Space {
  id
  name
  placements {
    ...SpacePlacement
  }
  blokPlacements {
    ...SpaceBlokPlacement
  }
}
