fragment ListSpace on Space {
  id
  name
  reference
}

# A placement as a space keeps it: where people left an agent, the same for
# everyone (one per space and agent, `role` the dependency key it was placed
# under). What stands there is drawn by the action's `Space` blok, not stored.
fragment SpacePlacement on Placement {
  id
  name
  role
  agent {
    id
    name
    connected
  }
  affineMatrix
}

# A room: where people left each agent (`reference` is an action Space blok's `room`).
fragment Space on Space {
  id
  name
  reference
  placements {
    ...SpacePlacement
  }
}
