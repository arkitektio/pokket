query ListTasks($filter: TaskFilter, $ordering: [TaskOrder!], $pagination: OffsetPaginationInput) {
  tasks(filters: $filter, ordering: $ordering, pagination: $pagination) {
    ...ListTask
  }
}

query DetailTask($id: ID!) {
  task(id: $id) {
    ...DetailTask
  }
}

# The actions that can answer in a chat room: they take a message and return
# one. `latestTask.args` is what the replyer was last run with, which is what
# pokket runs it with again.
query ReplyerActions {
  actions(
    filters: {
      demands: [
        { kind: ARGS, matches: [{ kind: STRUCTURE, identifier: "@alpaka/message" }] }
        { kind: RETURNS, matches: [{ kind: STRUCTURE, identifier: "@alpaka/message" }] }
      ]
    }
  ) {
    ...ReplyerAction
  }
}
