query Agents($filters: AgentFilter, $pagination: OffsetPaginationInput, $ordering: [AgentOrder!]) {
  agents(filters: $filters, pagination: $pagination, ordering: $ordering) {
    ...ListAgent
  }
}

query DetailAgent($id: ID!) {
  agent(id: $id) {
    ...DetailAgent
  }
}

query DetailImplementation($id: ID!) {
  implementation(id: $id) {
    ...DetailImplementation
  }
}

# The @rekuest/agent picker (a blok's StructurePicker). `$requires` is a port's
# descriptor constraints, handed on unchanged (the only descriptor of an agent
# is @rekuest/supervisor).
query AgentOptions($search: String, $values: [ID!], $requires: [RequiresInput!]) {
  options: agents(filters: { search: $search, ids: $values, requires: $requires }, pagination: { limit: 25 }) {
    value: id
    label: name
  }
}
