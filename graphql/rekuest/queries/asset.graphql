query AgentAssets($id: ID!) {
  agent(id: $id) {
    id
    assets {
      ...AgentAsset
    }
  }
}

query AssetPolicy {
  assetPolicy {
    model {
      ...ModelPolicy
    }
  }
}

query BloksForModel($ref: String!) {
  bloksForModel(ref: $ref) {
    ...ModelBlok
  }
}

# Read credentials for the file of the asset `ref`, valid for `expiresIn` seconds.
query AssetAccess($ref: String!) {
  asset(ref: $ref) {
    id
    file {
      ... on KulisseStore {
        id
        accessGrant {
          ...KulisseAccessGrant
        }
      }
      ... on MediaStore {
        id
        accessGrant {
          ...MediaAccessGrant
        }
      }
    }
  }
}
