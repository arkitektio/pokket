query MaterializedBlok($id: ID!) {
  materializedBlok(id: $id) {
    ...MaterializedBlok
  }
}

query ListMaterializedBloks(
  $filters: MaterializedBlokFilter
  $pagination: OffsetPaginationInput
  $ordering: [MaterializedBlokOrder!]
) {
  materializedBloks(filters: $filters, pagination: $pagination, ordering: $ordering) {
    ...ListMaterializedBlok
  }
}

# A logo blok's drawing: its tree and the demo state it shows.
query LogoBlok($id: ID!) {
  blok(id: $id) {
    id
    hash
    componentTree
    demoState
  }
}
