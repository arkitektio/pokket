fragment DetailClient on Client {
  id
  name
  user {
    id
    username
  }
  kind
  release {
    ...ListRelease
  }
  logo {
    presignedUrl
  }
  clientId
  mappings {
    ...ListServiceInstanceMapping
  }
}

fragment ListClient on Client {
  id
  user {
    id
    username
  }
  name
  kind
  release {
    version
    logo {
      presignedUrl
    }
    app {
      id
      identifier
      logo {
        presignedUrl
      }
    }
  }
}
