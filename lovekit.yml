overwrite: true
schema:
  "https://demo.arkitekt.live/lovekit/schema":
    handleAsSDL: true
documents: "graphql/lovekit/**/*.graphql"
generates:
  lib/lovekit/api/fragments.ts:
    plugins:
      - "fragment-matcher"
  lib/lovekit/api/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-react-apollo"
    config:
      withHooks: true
      reactApolloVersion: 3
      apolloReactHooksImportFrom: "@/lib/lovekit/funcs"

  lib/lovekit/graphql.schema.json:
    plugins:
      - "introspection"
